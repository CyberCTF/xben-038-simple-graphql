# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-038-24 Simple GraphQL (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a job search with a GraphQL endpoint (Strawberry) over SQLite.
# The benchmark folder benchmarks/XBEN-038-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in a development flag,
# swapped for the player's flag at start by its ctf-entrypoint.sh.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-038-simple-graphql

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.81.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page / is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-038-24 (Simple GraphQL) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The GraphQL job search takes parameters. Is every one of them safe?
